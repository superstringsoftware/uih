name:                uih
version:             0.1.0.0
# github:              "https://github.com/jhoxray/uih"
license:             BSD3
author:              "Author name here"
maintainer:          "jho.xray@gmail.com"
copyright:           "2019 Author name here"

extra-source-files:
- README.md
# - ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/jhoxray/uih#readme>

dependencies:
- base >= 4.7 && < 5
- text
- ghc-prim
- vector
- sdl2-ttf
- sdl2
- sdl2-image
- extra
- clock
- transformers
- mtl
- containers
- linear
- StateVar
- random
- bytestring


library:
  source-dirs: src

executables:
  uih:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - uih
    - base
    - sdl2
    - sdl2-ttf
    - linear
    - uih
    - sdl2-gfx
    - ghc-prim
    - directory
    - transformers
    - text

  t01:
    main:                01Test.hs
    source-dirs:         examples
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - uih
    - base
    - text

  ng:
    main:                NewGenTest.hs
    source-dirs:         examples/ng
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N -fprof-cafs  
    dependencies:
    - uih
    - base
    - text

  # UIH-Elm Examples
  counter-test:
